services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salao
      POSTGRES_PASSWORD: salao
      POSTGRES_DB: salao
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salao -d salao"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: